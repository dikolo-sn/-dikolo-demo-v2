<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - DiKoLo</title>
    <style>
        body { font-family: Arial; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Connexion DiKoLo</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="email" name="email" placeholder="demo@dikolo.com" required>
            <input type="password" name="password" placeholder="demo" required>
            <button type="submit">Se connecter</button>
        </form>
        <p style="font-size:12px; margin-top:15px;">Compte Demo: demo@dikolo.com / demo</p>
    </div>
</body>
</html>
